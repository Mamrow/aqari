# Home screen in list view (toggled from the map's list/map switch).
appId: com.mamrow.aqari
---
- runFlow: subflows/open_home_map.yaml
# The toggle's id names the mode it switches *to*, so this is an assertion
# that we started in map view, not a blind toggle.
- tapOn:
    id: "map-list-toggle-to-list"
- waitForAnimationToEnd
- takeScreenshot: "${LOCALE}_02_home_list"
