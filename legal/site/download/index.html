<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حمّل عقاري · Get Aqari</title>
<meta name="description" content="حمّل تطبيق عقاري للعقارات في ليبيا · Get Aqari, the Libyan property app">
<meta property="og:title" content="حمّل تطبيق عقاري">
<meta property="og:description" content="شقق، بيوت، وأراضي للبيع والإيجار في ليبيا · Property for sale and rent in Libya">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .download-shell { max-width: 520px; padding-block: 40px 56px; text-align: center; }
  .app-mark {
    width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 22px;
    background: var(--accent); display: grid; place-items: center;
  }
  .app-mark svg { width: 48px; height: 48px; }
  .download-title { font-size: 28px; font-weight: 800; color: var(--heading); margin: 0 0 8px; }
  .download-lede { color: var(--muted); font-size: 16px; margin: 0 0 28px; }
  .actions { display: grid; gap: 10px; }
  .btn-primary, .btn-store {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    border-radius: 12px; padding: 14px 16px; font-size: 16px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-store { border: 1px solid var(--border); color: var(--heading); background: var(--surface); }
  .btn-soon { opacity: .55; pointer-events: none; }
  .hint { color: var(--muted); font-size: 14px; margin: 16px 0 0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/download/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 11.5L12 4l8 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 20v-5h4v5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span data-ar="عقاري">Aqari</span>
    </a>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="btnEn" aria-pressed="false" onclick="aqariSetLang('en'); renderDownload()">EN</button>
      <button type="button" id="btnAr" aria-pressed="true" onclick="aqariSetLang('ar'); renderDownload()">عربي</button>
    </div>
  </div>
</div>

<main class="shell download-shell">
  <div class="app-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 11.5L12 4l8 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 20v-5h4v5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 id="title" class="download-title"></h1>
  <p id="lede" class="download-lede"></p>
  <div class="actions">
    <a id="appStore" class="btn-store"></a>
    <a id="playStore" class="btn-store"></a>
  </div>
  <p id="hint" class="hint"></p>
</main>

<script src="/script.js"></script>
<script>
  // The one link the social accounts, posts and QR codes point at:
  // https://lyaqari.netlify.app/download. A phone goes straight on to its own
  // store; a computer (or a phone whose redirect is blocked) sees both buttons.
  var APP_STORE = 'https://apps.apple.com/app/id6809884623';
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.mamrow.aqari';

  // false until Google approves the production release. Until then the Play
  // page reads "item not found" to anyone who isn't a closed-test tester, so
  // Android visitors get "coming soon" instead of a dead end. Flip it to true,
  // rebuild legal/site.zip and redeploy once the app is live on Play.
  var PLAY_LIVE = false;

  var TEXT = {
    ar: {
      title: 'حمّل تطبيق عقاري',
      lede: 'شقق، بيوت، وأراضي للبيع والإيجار في ليبيا. أضف عقارك مجاناً وتواصل مباشرة مع المالك.',
      appStore: 'حمّل من App Store',
      playStore: PLAY_LIVE ? 'حمّل من Google Play' : 'قريباً على Google Play',
      hintIos: 'جارٍ فتح App Store…',
      hintAndroidSoon: 'نسخة أندرويد قريباً على Google Play، تابع صفحتنا ليصلك الخبر.',
      hintAndroid: 'جارٍ فتح Google Play…',
    },
    en: {
      title: 'Get the Aqari app',
      lede: 'Apartments, houses and land for sale and rent in Libya. List your property free and contact owners directly.',
      appStore: 'Download on the App Store',
      playStore: PLAY_LIVE ? 'Get it on Google Play' : 'Coming soon to Google Play',
      hintIos: 'Opening the App Store…',
      hintAndroidSoon: 'The Android version is coming soon to Google Play. Follow our page to hear when.',
      hintAndroid: 'Opening Google Play…',
    },
  };

  var ua = navigator.userAgent || '';
  // iPadOS reports itself as a Mac; a touch screen tells them apart.
  var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  function lang() { return document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'ar'; }

  function renderDownload() {
    var t = TEXT[lang()];
    document.title = t.title + ' · Aqari';
    document.getElementById('title').textContent = t.title;
    document.getElementById('lede').textContent = t.lede;

    var ios = document.getElementById('appStore');
    var play = document.getElementById('playStore');
    ios.textContent = t.appStore;
    ios.href = APP_STORE;
    play.textContent = t.playStore;
    if (PLAY_LIVE) play.href = PLAY_STORE; else play.removeAttribute('href');
    play.className = 'btn-store' + (PLAY_LIVE ? '' : ' btn-soon');

    // The visitor's own store is the main button, and comes first.
    var mine = isIos ? ios : isAndroid && PLAY_LIVE ? play : null;
    if (mine) {
      mine.className = 'btn-primary';
      mine.parentNode.insertBefore(mine, mine.parentNode.firstChild);
    }

    var hint = '';
    if (isIos) hint = t.hintIos;
    else if (isAndroid) hint = PLAY_LIVE ? t.hintAndroid : t.hintAndroidSoon;
    document.getElementById('hint').textContent = hint;
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderDownload();
    var target = isIos ? APP_STORE : isAndroid && PLAY_LIVE ? PLAY_STORE : null;
    // replace(), so the back button doesn't land on this page and bounce
    // straight back to the store.
    if (target) location.replace(target);
  });
</script>
</body>
</html>
