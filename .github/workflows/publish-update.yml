# Sends a JavaScript-only change to installed builds, without a new build.
#
# Manual only, like the iOS build. Phones pick the update up the next time
# the app is opened, and apply it on the launch after that.
#
# Safe against native mismatches by construction: app.json's runtimeVersion
# uses the "fingerprint" policy, a hash of everything native — dependencies,
# config plugins, app config. A change that needs a new build (a new native
# library, an SDK upgrade) produces a different fingerprint, and installed
# builds simply don't take that update. They keep running what they have.
# That's the difference between this and build 17, which crashed on launch.
#
# Publish from here rather than from a Windows machine. The fingerprint hashes
# files like app.json, and a Windows checkout turns their line endings into
# CRLF — so an update published from Windows gets a different fingerprint
# from the build it's meant for, and silently reaches nobody.

name: Publish update

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the EAS dashboard)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --environment production --message "$MESSAGE" --non-interactive

      # Updates replace the JavaScript a build shipped with, so without this a
      # crash in updated code shows minified frames in Sentry.
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aqari-l7
          SENTRY_PROJECT: react-native
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN secret; skipping."; exit 0; fi
          npx sentry-expo-upload-sourcemaps dist
