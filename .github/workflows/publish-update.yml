# Sends a JavaScript-only change to installed builds, without a new build.
#
# Manual only, like the iOS build. Phones pick the update up the next time
# the app is opened, and apply it on the launch after that.
#
# An update reaches a build when both carry the same runtimeVersion, which
# app.json ties to the app's version number. So every 1.0.0 build accepts
# every update published while the version reads 1.0.0.
#
# That means the version number is a manual safety catch: when something
# native changes — a new native library, an SDK upgrade, a new icon or splash
# — bump `expo.version` in app.json in the same commit. Builds on the old
# version then ignore updates built for the new one, instead of taking JS that
# calls native code they don't have and crashing on launch, the way build 17
# did.
#
# The "fingerprint" policy automates exactly that check, and was what this
# used until it turned out to hash differently on every OS: Windows, Linux and
# the macOS build runner each produced a different value for identical code,
# so updates silently reached nobody.

name: Publish update

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the EAS dashboard)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --environment production --message "$MESSAGE" --non-interactive

      # Updates replace the JavaScript a build shipped with, so without this a
      # crash in updated code shows minified frames in Sentry.
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aqari-l7
          SENTRY_PROJECT: react-native
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN secret; skipping."; exit 0; fi
          npx sentry-expo-upload-sourcemaps dist
